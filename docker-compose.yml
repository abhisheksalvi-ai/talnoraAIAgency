version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: talnora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talnora
      POSTGRES_PASSWORD: talnora_pass
      POSTGRES_DB: talnora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talnora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: talnora_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: talnora_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: talnora_backend
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Next.js)
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: talnora_frontend
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.local
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  qdrant_data:
  redis_data: